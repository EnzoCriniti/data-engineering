# Cap 09 - Migracao HDFS para S3/MinIO.
# Papéis: Airflow ORQUESTRA -> Spark TRANSFORMA e faz tiering (quente->frio)
#         -> HDFS + MinIO ARMAZENAM -> Trino FEDERA e SERVE -> Metabase MOSTRA.
services:
  # ---- Zona quente: HDFS (namenode + datanode) ----
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: p09-namenode
    environment:
      CLUSTER_NAME: portfolio
    ports:
      - "9870:9870"
    volumes:
      - hdfs-name:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: p09-datanode
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hdfs-data:/hadoop/dfs/data

  # ---- Zona fria: object storage S3-compatible ----
  minio:
    image: minio/minio:latest
    container_name: p09-minio-cloud-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # ---- Processamento + tiering: Spark lê das duas zonas ----
  spark-master:
    image: bitnami/spark:3.5
    container_name: p09-spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/jobs

  spark-worker:
    image: bitnami/spark:3.5
    container_name: p09-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./spark/jobs:/jobs

  # ---- Orquestração: Airflow agenda transformação + job de tiering ----
  airflow:
    image: apache/airflow:2.9.3
    container_name: p09-airflow
    depends_on:
      - spark-master
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: standalone

  # ---- Query engine: Trino federa HDFS (quente) + S3 (frio) numa query só ----
  trino:
    image: trinodb/trino:latest
    container_name: p09-trino
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  # ---- BI: Metabase consome o Trino ----
  metabase:
    image: metabase/metabase:latest
    container_name: p09-metabase
    depends_on:
      - trino
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  hdfs-name:
  hdfs-data:
  minio-data:
  metabase-data:
