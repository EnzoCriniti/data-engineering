services:
  oltp:
    mem_limit: 256m
    cpus: "0.25"
  warehouse:
    mem_limit: 256m
    cpus: "0.25"
  seeder:
    mem_limit: 192m
    cpus: "0.25"
    environment:
      SEED_CLIENTES: "50"
      SEED_PEDIDOS: "200"
  simulador:
    mem_limit: 192m
    cpus: "0.25"
    environment:
      SIM_PEDIDOS: "5"
  pipeline:
    mem_limit: 320m
    cpus: "0.5"
  transportadora:
    mem_limit: 96m
  airflow-db:
    mem_limit: 256m
    cpus: "0.25"
  airflow-scheduler:
    mem_limit: 1280m
    cpus: "1.0"
    environment:
      SIM_PEDIDOS: "5"
      API_PAGE_SIZE: "2"
