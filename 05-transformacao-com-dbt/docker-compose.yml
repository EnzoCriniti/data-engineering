services:
  metabase:
    image: metabase/metabase:latest
    container_name: p05-metabase
    ports:
      - "${METABASE_PORT:-3002}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  metabase-data:
