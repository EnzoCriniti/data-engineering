services:
  feature-store:
    image: postgres:16
    container_name: p13-feature-store
    ports:
      - "${FEATURE_DB_PORT:-5440}:5432"
    environment:
      POSTGRES_DB: ${FEATURE_DB:-features}
      POSTGRES_USER: ${FEATURE_USER:-features}
      POSTGRES_PASSWORD: ${FEATURE_PASSWORD:-features}
    volumes:
      - feature-data:/var/lib/postgresql/data
      - ./features/schema.sql:/docker-entrypoint-initdb.d/01-features.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FEATURE_USER:-features} -d ${FEATURE_DB:-features}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feature-data:
