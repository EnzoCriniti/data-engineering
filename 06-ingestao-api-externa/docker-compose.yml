services:
  transportadora-api:
    image: python:3.12-slim
    container_name: p06-transportadora-api
    working_dir: /app
    ports:
      - "${API_PORT:-8088}:8080"
    volumes:
      - ./api:/app
    command: ["python", "-m", "http.server", "8080"]

  warehouse:
    image: postgres:16
    container_name: p06-warehouse
    ports:
      - "${WAREHOUSE_PORT:-5438}:5432"
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_USER:-analytics}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-analytics}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./extractor/staging.sql:/docker-entrypoint-initdb.d/01-staging.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-analytics} -d ${WAREHOUSE_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warehouse-data:
