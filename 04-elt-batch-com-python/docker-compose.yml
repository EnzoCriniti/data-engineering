services:
  oltp:
    image: postgres:16
    container_name: p04-oltp
    ports:
      - "${OLTP_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${OLTP_DB:-nuvemstore}
      POSTGRES_USER: ${OLTP_USER:-app}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD:-app}
    volumes:
      - oltp-data:/var/lib/postgresql/data
      - ../00-modelagem-transacional/ddl/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER:-app} -d ${OLTP_DB:-nuvemstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seeder:
    build:
      context: ../00-modelagem-transacional/seed
    container_name: p04-seeder
    profiles: ["jobs"]
    depends_on:
      oltp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${OLTP_USER:-app}:${OLTP_PASSWORD:-app}@oltp:5432/${OLTP_DB:-nuvemstore}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-250}
      SEED_ORDERS: ${SEED_ORDERS:-1200}
      SEED_RESET: ${SEED_RESET:-true}

  pipeline:
    build:
      context: ./pipeline
    container_name: p04-pipeline
    profiles: ["jobs"]
    depends_on:
      oltp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${OLTP_USER:-app}:${OLTP_PASSWORD:-app}@oltp:5432/${OLTP_DB:-nuvemstore}
      DUCKDB_PATH: /warehouse/nuvemstore.duckdb
    volumes:
      - ./data/warehouse:/warehouse

  metabase:
    image: metabase/metabase:latest
    container_name: p04-metabase
    profiles: ["bi"]
    ports:
      - "${METABASE_PORT:-3001}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  oltp-data:
  metabase-data:
